name: Bug
description: It crashed, gave a wrong count, or did something unexpected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Don't paste tokens or secrets. Edit out private repo names and paths if they matter to you.
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python3 scan.py --repo owner/name
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the error or output.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, macOS 15
